version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: vocalflow-postgres
    restart: always
    environment:
      POSTGRES_USER: ascend
      POSTGRES_PASSWORD: ascend
      POSTGRES_DB: ascend_lms
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ascend -d ascend_lms"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: vocalflow-app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ascend:ascend@db:5432/ascend_lms
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:
